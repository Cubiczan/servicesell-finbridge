# ============================================================
# Cubiczan CHP Executa — multi-platform binaries for Anna
# ============================================================
# Builds PyInstaller onefile archives that match
# executas/servicesell-finbridge/executa.json
# distribution.profiles.binary.binary_artifacts.
#
# linux-x86_64 is required: Anna Cloud Agent is Linux.
# Do not commit dist/ archives. Download Release assets into
# executas/servicesell-finbridge/dist/ then run:
#   npx anna-app apps publish
#
# Trigger: Actions → "Build Executa binaries" → Run workflow
# Or tag a GitHub Release.
# ============================================================

name: Build Executa binaries

on:
  workflow_dispatch:
  release:
    types: [created]
  push:
    tags:
      - "cubiczan-chp-v*"
      - "v*"

permissions:
  contents: write

concurrency:
  group: executa-binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Cloud Agent target — must succeed.
          - os: ubuntu-latest
            platform: linux-x86_64
            python_arch: ""
          - os: macos-14
            platform: darwin-arm64
            python_arch: ""
          # Intel macOS via Rosetta on Apple Silicon. macos-13 Intel
          # runners are retired and queue forever.
          - os: macos-15
            platform: darwin-x86_64
            python_arch: x64
          - os: windows-latest
            platform: windows-x86_64
            python_arch: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch || '' }}

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Package ${{ matrix.platform }}
        run: python scripts/package_executa.py --platform ${{ matrix.platform }}

      - name: Confirm linux-x86_64 artifact name
        if: matrix.platform == 'linux-x86_64'
        shell: bash
        run: |
          ls -lh executas/servicesell-finbridge/dist/
          test -f executas/servicesell-finbridge/dist/cubiczan-chp-*-linux-x86_64.tar.gz

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cubiczan-chp-${{ matrix.platform }}
          path: |
            executas/servicesell-finbridge/dist/cubiczan-chp-*${{ matrix.platform }}.*
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            executas/servicesell-finbridge/dist/cubiczan-chp-*${{ matrix.platform }}.tar.gz
            executas/servicesell-finbridge/dist/cubiczan-chp-*${{ matrix.platform }}.tar.gz.sha256
            executas/servicesell-finbridge/dist/cubiczan-chp-*${{ matrix.platform }}.zip
            executas/servicesell-finbridge/dist/cubiczan-chp-*${{ matrix.platform }}.zip.sha256
          fail_on_unmatched_files: false
